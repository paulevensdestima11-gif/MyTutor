<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TutorFlow{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard.index') }}">
            TutorFlow
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('dashboard.index') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('students.index') }}">Students</a>
            <a class="nav-link" href="{{ url_for('lessons.index') }}">Lessons</a>
            <a class="nav-link" href="{{ url_for('homework.index') }}">Homework</a>
        </div>

        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm"
               href="{{ url_for('change_language', lang='en') }}">EN</a>

            <a class="btn btn-outline-light btn-sm"
               href="{{ url_for('change_language', lang='de') }}">DE</a>
        </div>
    </div>
</nav>

<main class="container mt-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close"
                            data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
