
name: TutorFlow Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "40-character Git commit SHA of the image in ECR"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: eu-central-1
      EC2_INSTANCE_ID: i-03010727462391377
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Validate image tag
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "ERROR: Image tag must be a 40-character Git commit SHA."
            exit 1
          fi

          echo "Image tag format is valid."

      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Validate deployment script
        run: bash -n deploy/deploy.sh

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::442879245415:role/tutorflow-github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare SSM deployment command
        shell: bash
        run: |
          SCRIPT_BASE64="$(base64 -w 0 deploy/deploy.sh)"

          REMOTE_COMMAND="printf '%s' '${SCRIPT_BASE64}' | base64 -d > /tmp/tutorflow-deploy.sh && chmod 700 /tmp/tutorflow-deploy.sh && /tmp/tutorflow-deploy.sh '${IMAGE_TAG}'; RESULT=\$?; rm -f /tmp/tutorflow-deploy.sh; exit \$RESULT"

          jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}' > ssm-parameters.json

      - name: Send deployment command through SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy TutorFlow image $IMAGE_TAG" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "TutorFlow deployment succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Deployment timed out waiting for SSM."
          exit 1
